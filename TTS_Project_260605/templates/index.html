<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>Local AI Voice Assistant</title>

<style>

body{

    font-family:Arial;

    background:#f5f5f5;

    display:flex;

    justify-content:center;

    padding-top:40px;
}

.main{

    width:900px;

    background:white;

    padding:30px;

    border-radius:12px;

    box-shadow:0 0 15px rgba(0,0,0,.1);
}

textarea{

    width:100%;

    height:200px;

    font-size:18px;

    padding:10px;
}

.controls{

    margin-top:15px;

    display:flex;

    gap:10px;
}

button{

    width:120px;

    height:45px;

    cursor:pointer;
}

.response-box{

    margin-top:30px;

    border:1px solid #ddd;

    padding:15px;

    min-height:120px;

    background:#fafafa;

    white-space:pre-wrap;
}

.spinner{

    display:none;

    margin-top:15px;

    font-weight:bold;
}

audio{

    width:100%;

    margin-top:20px;
}

</style>

</head>

<body>

<div class="main">

    <h2>Local AI Voice Assistant</h2>

    <div>

        Voice:

        <select id="voiceSelect">

            <option>M1</option>
            <option>F1</option>
            <option>F2</option>

        </select>

    </div>

    <br>

    <textarea
        id="inputText"
        placeholder="Ask anything..."
    ></textarea>

    <div class="controls">

        <button id="askBtn">

            Ask AI

        </button>

        <button id="clearBtn">

            Clear

        </button>

    </div>

    <div
        id="spinner"
        class="spinner"
    >

        Generating response...

    </div>

    <div
        id="responseBox"
        class="response-box"
    >

        Assistant response will appear here.

    </div>

    <audio
        id="player"
        controls
    ></audio>

</div>

<script src="/static/script.js"></script>

</body>

</html>
